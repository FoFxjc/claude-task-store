name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Explicit typecheck of BOTH TypeScript boundaries: tsconfig.json for
      # src/ and tsconfig.opencode.json for the OpenCode adapter that ships
      # into user projects. ts-jest type-checks the adapter at import time,
      # but only tsconfig.json's compiler options apply there — this step is
      # what actually exercises tsconfig.opencode.json.
      - name: Typecheck (src + opencode-plugin)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Acceptance test
        run: bash tests/acceptance.sh

      - name: Phase 2 reliability suites
        run: |
          bash tests/phase2/pressure_test.sh
          bash tests/phase2/decay_test.sh
          bash tests/phase2/recovery_test.sh
          bash tests/phase2/safety_test.sh
          bash tests/phase2/git_workflow_test.sh

      - name: Phase 3 cross-agent handoff suite
        run: bash tests/phase3/handoff_test.sh

      - name: Installer/uninstaller regression suite
        run: bash tests/install_regression_test.sh

      - name: Path safety regression suite
        run: bash tests/path_safety_test.sh

      - name: Project-local runtime suite
        run: bash tests/local_runtime_test.sh

      - name: Auto-checkpoint suite
        run: bash tests/autocheckpoint_test.sh

      - name: OpenCode install/uninstall regression
        run: bash tests/opencode_install_test.sh

      # The two OpenCode smoke suites below require a working `opencode`
      # binary on PATH. The CI runner doesn't ship one, so they are wired
      # up to skip cleanly when the binary is absent. They run locally
      # and via developer machines that have OpenCode installed.
      - name: OpenCode resume-injection smoke (skips if opencode is absent)
        run: |
          if command -v opencode >/dev/null 2>&1; then
            bash tests/opencode_smoke_test.sh || [ $? -eq 77 ]
          else
            echo "opencode not installed; skipping OpenCode resume smoke"
          fi

      - name: OpenCode auto-checkpoint smoke (skips if opencode is absent)
        run: |
          if command -v opencode >/dev/null 2>&1; then
            bash tests/opencode_autockpt_smoke_test.sh || [ $? -eq 77 ]
          else
            echo "opencode not installed; skipping OpenCode auto-checkpoint smoke"
          fi
